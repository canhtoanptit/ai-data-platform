[project]
name = "anz-collections-api"
version = "0.1.0"
description = "FastAPI read layer over the dbt collections marts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    # psycopg2-binary ships prebuilt wheels, so neither the Docker image nor a
    # laptop needs a compiler or libpq-dev to install it.
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.6",
    # The official OpenAI SDK, pointed at Groq's OpenAI-compatible endpoint (see
    # app/llm.py). Using the compatible API rather than a vendor SDK keeps the
    # provider swappable — Groq today, anything tomorrow, one env change.
    "openai>=1.60",
    # SQL parser used to validate the model's SQL before it reaches the
    # warehouse. A parser, not a regex: see app/sql_guard.py.
    "sqlglot>=25",
    # Per-IP rate limiting on /api/chat only. Thin Starlette glue over `limits`,
    # which gets the window arithmetic right and swaps to Redis by changing one
    # URI. See app/rate_limit.py.
    "slowapi>=0.1.9",
    # Airflow's REST API client (app/airflow_client.py) — three calls, so a
    # plain HTTP client rather than the `apache-airflow` package, which would
    # pull its own Flask and SQLAlchemy into this service for nothing. Promoted
    # from the dev group, where it was already present as fastapi's TestClient
    # transport: it is now runtime code, and a dependency the app imports at
    # request time does not belong in a dev-only group.
    "httpx>=0.27",
    # Multipart parsing for the file upload on /api/ingest. FastAPI raises at
    # import time if a route declares Form()/UploadFile() without it.
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Reads evals/golden.yaml. A dev dependency, not a runtime one: the eval
    # harness runs from the source tree and is deliberately not packaged into
    # the Docker image, which serves the API and nothing else.
    "pyyaml>=6.0",
]

# The app is installed as a real package (not just a folder on sys.path) so that
# `uvicorn app.main:app` resolves identically in Docker, in tests, and in dev.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette 1.6 renamed two status constants (HTTP_422_UNPROCESSABLE_ENTITY
    # -> ..._CONTENT, HTTP_413_REQUEST_ENTITY_TOO_LARGE -> HTTP_413_CONTENT_TOO_LARGE).
    # The app deliberately still uses the old names: they exist in every
    # Starlette version this project's `fastapi>=0.115` floor allows, while the
    # new ones do not — so switching would trade a warning for an ImportError on
    # an older resolution. Silenced here so the churn stays out of the summary.
    "ignore:'HTTP_4",
]
# `app` is installed as a package, but `evals` deliberately is not (it is a test
# instrument, kept out of the wheel and the Docker image). Putting api/ on the
# path is what lets tests/test_eval_compare.py import evals.compare.
pythonpath = ["."]
