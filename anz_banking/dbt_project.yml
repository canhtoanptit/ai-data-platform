name: 'anz_banking'
version: '1.0.0'

# The profile in .dbt/profiles.yml that dbt connects with. It has two targets:
# `dev` (Snowflake, the default) and `local` (Postgres in docker-compose).
profile: 'anz_banking'

# Where dbt looks for each type of file. These are the defaults.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # removed by `dbt clean`
  - "target"
  - "dbt_packages"

# --- Model materialisation strategy, by layer ---------------------------
# staging     -> views  (cheap, always fresh, thin rename/cast layer)
# intermediate-> ephemeral (inlined as CTEs, no warehouse object)
# marts       -> tables (queried often by BI, worth materialising)
models:
  anz_banking:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

# Seeds land in a dedicated schema and we type a few columns explicitly so the
# warehouse doesn't guess (e.g. keep money as fixed-point, ids as INT).
# Types are spelled portably so the same seeds load on Snowflake AND Postgres:
#   numeric(12,2) -- Snowflake synonym for NUMBER, native Postgres type
#   timestamp     -- Snowflake TIMESTAMP defaults to NTZ; Postgres has no
#                    TIMESTAMP_NTZ type name
seeds:
  anz_banking:
    +schema: raw
    raw_accounts:
      +column_types:
        credit_limit: numeric(12,2)
        current_balance: numeric(12,2)
    raw_payments:
      +column_types:
        amount: numeric(12,2)
    raw_collection_cases:
      +column_types:
        delinquent_amount: numeric(12,2)
    raw_promises_to_pay:
      +column_types:
        promised_amount: numeric(12,2)
    raw_accounts_cdc:
      +column_types:
        cdc_timestamp: timestamp
        credit_limit: numeric(12,2)
        current_balance: numeric(12,2)
