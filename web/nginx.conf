# Serves the built SPA and puts the API on the same origin.
#
# Replaces nginx's default server block (see Dockerfile).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints every filename in assets/, so a cached copy can never be
    # stale — the URL changes when the content does.
    location /assets/ {
        # One add_header, not `expires` as well — nginx would emit two
        # Cache-Control headers and let the client pick.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Inside the compose network the API's hostname is its SERVICE NAME (`api`)
    # — `localhost` here would be this nginx container. The trailing slash is
    # omitted from proxy_pass on purpose: that keeps the /api/ prefix in the
    # forwarded path, which is where the FastAPI routes actually live.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page app has no files behind its routes, so anything that is not
    # a real asset gets the app shell and is resolved client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
