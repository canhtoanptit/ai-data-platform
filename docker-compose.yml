# Local warehouse for the dbt project.
#
# Snowflake can't run on a laptop, so Postgres stands in as a local target you
# can spin up, break, and throw away. The dbt project builds against BOTH:
#   `make build`        -> Snowflake (target: dev)
#   `make local-build`  -> this container (target: local)
#
# Defaults below match the `local` output in .dbt/profiles.yml, so
# `make local-up && make local-build` works with no .env changes at all.

services:
  postgres:
    image: postgres:16
    container_name: anz_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
    ports:
      # host:container — host port is overridable in case 5432 is taken locally.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `make local-up` waits on this before handing off to dbt.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # FastAPI read layer over the marts dbt built. See api/README.md.
  api:
    build: ./api
    container_name: anz_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Inside the compose network, containers reach each other by SERVICE NAME
      # — so the host is `postgres`, not `localhost` (localhost inside a
      # container is that container itself). Likewise 5432 here is the
      # container's own port, not the host-mapped POSTGRES_PORT above.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      MARTS_SCHEMA: ${MARTS_SCHEMA:-analytics_marts}
      # Where the catalog / lineage / runs endpoints read dbt's artifacts. The
      # code's default is a path relative to the repo, which does not exist in
      # the image (the app is installed into site-packages), so compose points
      # it at the mount below.
      DBT_ARTIFACTS_DIR: /srv/dbt-target
      # AI chat (/api/chat). `:-` so the stack still starts with no key in .env
      # — the endpoint then answers 503 with setup instructions and every other
      # endpoint is unaffected. The key is passed in, never baked into the image.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
    volumes:
      # dbt's manifest.json / run_results.json / catalog.json. These are BUILD
      # OUTPUTS owned by whoever ran `make local-build` on the host — the API
      # only ever reads them, so the mount is :ro and the container cannot
      # corrupt a build. Bind-mounted rather than copied into the image on
      # purpose: rebuild the dbt project and the API serves the new artifacts on
      # the next request (dbt_artifacts.py caches on file mtime), no image
      # rebuild, no restart.
      - ./anz_banking/target:/srv/dbt-target:ro
    depends_on:
      postgres:
        # Wait for pg_isready, not just "container started", so the API's first
        # connection doesn't race Postgres' startup.
        condition: service_healthy
    restart: unless-stopped

  # React dashboard. The image is nginx serving a static build — it holds no
  # secrets and talks to nothing at build time, so the API URL is not baked in:
  # the browser calls same-origin /api/... and nginx proxies it to the `api`
  # service. See web/nginx.conf.
  web:
    build: ./web
    container_name: anz_web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
